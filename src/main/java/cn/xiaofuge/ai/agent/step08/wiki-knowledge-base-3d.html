<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM-Wiki 知识图谱 · 3D 可视化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050a0a; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #e6f5ee; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  .panel {
    position: fixed; z-index: 10;
    background: rgba(8, 22, 18, 0.72);
    border: 1px solid rgba(90, 220, 180, 0.25);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45), inset 0 0 30px rgba(60, 200, 160, 0.05);
  }

  #titlePanel { top: 22px; left: 24px; padding: 14px 22px; }
  #titlePanel h1 {
    font-size: 20px; letter-spacing: 2px; font-weight: 700;
    background: linear-gradient(90deg, #69f0ae, #4dd0e1, #ffe082);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #titlePanel .sub { font-size: 11px; color: #6f9688; margin-top: 4px; letter-spacing: 1px; }

  /* 统计卡：节点 / 边 / 边类型 */
  #statsBar { top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 14px; }
  .stat { min-width: 92px; text-align: center; padding: 4px 10px; }
  .stat .num {
    font-size: 24px; font-weight: 800; font-family: "SF Mono", Menlo, monospace;
    background: linear-gradient(180deg, #aef3d8, #4dd0e1);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat .lbl { font-size: 11px; color: #6f9688; margin-top: 2px; letter-spacing: 1px; }

  #descPanel { top: 110px; left: 24px; width: 320px; padding: 18px 20px; }
  #descPanel .step-tag {
    display: inline-block; font-size: 11px; letter-spacing: 2px; color: #050a0a;
    background: linear-gradient(90deg, #69f0ae, #4dd0e1);
    padding: 3px 10px; border-radius: 20px; font-weight: 700; margin-bottom: 10px;
  }
  #descPanel h2 { font-size: 18px; margin-bottom: 10px; color: #dcf5ea; }
  #descPanel p { font-size: 13px; line-height: 1.85; color: #9dbcaf; }
  #descPanel p b { color: #7fead0; font-weight: 600; }
  #descPanel p em { color: #ffe082; font-style: normal; font-weight: 600; }

  #stepper { bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 14px; align-items: center; }
  .step-btn {
    padding: 9px 16px; font-size: 13px; color: #8fb5a8; cursor: pointer;
    border: 1px solid rgba(90, 220, 180, 0.25); border-radius: 10px;
    background: rgba(14, 40, 32, 0.5); transition: all .25s; user-select: none; letter-spacing: 1px;
  }
  .step-btn:hover { color: #fff; border-color: rgba(120, 240, 200, 0.6); }
  .step-btn.active {
    color: #050a0a; font-weight: 700;
    background: linear-gradient(90deg, #69f0ae, #4dd0e1);
    border-color: transparent; box-shadow: 0 0 18px rgba(105, 240, 174, 0.5);
  }

  /* 课程讲解区（右侧常驻） */
  #coursePanel {
    top: 110px; right: 24px; width: 360px;
    max-height: calc(100vh - 280px);
    display: flex; flex-direction: column;
    padding: 16px 18px 12px;
  }
  .co-header {
    font-size: 13px; font-weight: 700; color: #dcf5ea; letter-spacing: 2px;
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(90, 220, 180, 0.2);
  }
  .co-header span { font-size: 10px; color: #51756a; font-weight: 400; letter-spacing: 1.5px; }
  #courseOutline { flex: none; }
  .co-item {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 9px; margin: 3px 0; border-radius: 8px;
    font-size: 12.5px; color: #8fb5a8; cursor: pointer;
    border: 1px solid transparent; transition: all .2s; user-select: none;
  }
  .co-item:hover { background: rgba(90, 220, 180, 0.08); color: #dcf5ea; }
  .co-item.active {
    background: rgba(105, 240, 174, 0.12); color: #eafff5; font-weight: 600;
    border-color: rgba(105, 240, 174, 0.35);
    box-shadow: inset 2px 0 0 #69f0ae;
  }
  .co-item .co-num {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: #050a0a;
    background: rgba(90, 220, 180, 0.35);
  }
  .co-item.active .co-num { background: linear-gradient(135deg, #69f0ae, #4dd0e1); }
  .co-item.done .co-num { background: rgba(77, 208, 225, 0.55); }
  #courseDetail { flex: 1; overflow-y: auto; margin-top: 12px; padding-right: 6px; }
  #courseDetail::-webkit-scrollbar { width: 5px; }
  #courseDetail::-webkit-scrollbar-thumb { background: rgba(90, 220, 180, 0.25); border-radius: 3px; }
  .co-sec { margin-bottom: 13px; }
  .co-sec-t {
    font-size: 11px; letter-spacing: 2px; color: #7fead0; font-weight: 700;
    margin-bottom: 6px; display: flex; align-items: center; gap: 7px;
  }
  .co-sec-t::before { content: ""; width: 3px; height: 11px; border-radius: 2px; background: linear-gradient(180deg, #69f0ae, #4dd0e1); }
  .co-sec ul { list-style: none; }
  .co-sec li {
    font-size: 12.5px; line-height: 1.8; color: #9dbcaf;
    padding-left: 14px; position: relative; margin-bottom: 4px;
  }
  .co-sec li::before {
    content: ""; position: absolute; left: 2px; top: 9px;
    width: 5px; height: 5px; border-radius: 50%; background: #4dd0e1; opacity: 0.7;
  }
  .co-sec li b { color: #7fead0; font-weight: 600; }
  .co-sec li em { color: #ffe082; font-style: normal; font-weight: 600; }
  .co-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .co-chips span {
    font-size: 11px; padding: 3px 10px; border-radius: 12px;
    background: rgba(179, 136, 255, 0.13); color: #cdb8ff;
    border: 1px solid rgba(179, 136, 255, 0.3);
  }
  .co-sum p {
    font-size: 12.5px; line-height: 1.8; color: #eafff5;
    padding: 8px 11px; border-radius: 8px;
    background: rgba(105, 240, 174, 0.07); border-left: 3px solid #69f0ae;
  }
  .co-sum p b { color: #7fead0; }

  /* 悬停信息卡（移至右下，图例上方） */
  #infoPanel { bottom: 216px; right: 24px; width: 300px; padding: 16px 18px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #infoPanel .ip-name { font-size: 16px; font-weight: 700; color: #eafff5; margin-bottom: 4px; }
  #infoPanel .ip-type { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 12px; margin-bottom: 10px; color: #050a0a; font-weight: 700; }
  #infoPanel .ip-row { font-size: 12.5px; color: #9dbcaf; line-height: 1.8; }
  #infoPanel .ip-row b { color: #7fead0; }
  #infoPanel .ip-links { margin-top: 8px; font-size: 12px; line-height: 1.9; }
  #infoPanel .ip-links span { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 9px; border-radius: 10px; background: rgba(90, 220, 180, 0.12); color: #aef3d8; }

  /* 问答卡（第④⑤幕，移至左列、解说面板下方） */
  #qaPanel { top: 388px; left: 24px; width: 320px; padding: 16px 18px; opacity: 0; transition: opacity .5s; pointer-events: none; }
  #qaPanel .q-label, #qaPanel .a-label { font-size: 11px; letter-spacing: 2px; color: #6f9688; margin-bottom: 6px; }
  #qaPanel .q-text {
    font-size: 14px; color: #ffe082; line-height: 1.6; margin-bottom: 14px;
    padding: 10px 12px; border-radius: 8px; background: rgba(255, 213, 79, 0.08);
    border-left: 3px solid #ffd54f;
  }
  #qaPanel .a-label { color: #69f0ae; }
  #qaPanel .a-text {
    font-size: 13px; color: #d2f7e2; line-height: 1.8; min-height: 60px;
    padding: 10px 12px; border-radius: 8px; background: rgba(105, 240, 174, 0.06);
    border-left: 3px solid #69f0ae; white-space: pre-wrap;
  }
  #qaPanel .a-text::after { content: "▌"; color: #69f0ae; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #subtitle {
    position: fixed; z-index: 10; bottom: 86px; left: 50%; transform: translateX(-50%);
    max-width: 900px; padding: 13px 26px 13px 16px; text-align: left;
    display: flex; align-items: center; gap: 14px;
    font-size: 15.5px; line-height: 1.75; color: #eafff5; letter-spacing: 0.5px;
    opacity: 0; transition: opacity .35s; pointer-events: none;
  }
  #subtitle .s-avatar {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #050a0a; letter-spacing: 1px;
    background: linear-gradient(135deg, #69f0ae, #4dd0e1);
    box-shadow: 0 0 16px rgba(105, 240, 174, 0.5);
  }
  #subtitle b { color: #7fead0; font-weight: 600; }
  #subtitle em { color: #ffe082; font-style: normal; font-weight: 600; }

  #legend { bottom: 26px; right: 24px; padding: 12px 16px; font-size: 12px; }
  #legend .lg-title { font-size: 10px; letter-spacing: 2px; color: #6f9688; margin-bottom: 8px; }
  #legend .lg-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; color: #9dbcaf; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  #legend .line { width: 16px; height: 2px; border-radius: 2px; }

  #hint { bottom: 30px; left: 24px; font-size: 11px; color: #51756a; letter-spacing: 1px; position: fixed; z-index: 10; }

  #loading {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: #050a0a; color: #69f0ae; font-size: 15px; letter-spacing: 3px; transition: opacity .8s;
  }
  @media (max-width: 980px) {
    #descPanel { width: 250px; }
    #qaPanel, #infoPanel, #legend, #statsBar, #coursePanel { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">正在编织知识图谱 …</div>

<div id="titlePanel" class="panel">
  <h1>LLM-Wiki 知识图谱 · 三维演绎</h1>
  <div class="sub">KNOWLEDGE GRAPH — 节点是知识，边是关系，检索是顺藤摸瓜</div>
</div>

<div id="statsBar" class="panel">
  <div class="stat"><div class="num" id="stNodes">0</div><div class="lbl">节点</div></div>
  <div class="stat"><div class="num" id="stEdges">0</div><div class="lbl">边</div></div>
  <div class="stat"><div class="num" id="stTypes">0</div><div class="lbl">边类型</div></div>
</div>

<div id="descPanel" class="panel">
  <span class="step-tag" id="descTag"></span>
  <h2 id="descTitle"></h2>
  <p id="descBody"></p>
</div>

<div id="coursePanel" class="panel">
  <div class="co-header">课程结构<span>COURSE OUTLINE</span></div>
  <div id="courseOutline"></div>
  <div id="courseDetail"></div>
</div>

<div id="infoPanel" class="panel">
  <div class="ip-name" id="ipName"></div>
  <span class="ip-type" id="ipType"></span>
  <div class="ip-row">关联度 <b id="ipDeg"></b> · 高亮连线即关系圈</div>
  <div class="ip-links" id="ipLinks"></div>
</div>

<div id="qaPanel" class="panel">
  <div class="q-label">USER QUERY · 用户提问</div>
  <div class="q-text" id="qText"></div>
  <div class="a-label">LLM ANSWER · 沿图谱路径生成</div>
  <div class="a-text" id="aText"></div>
</div>

<div id="subtitle" class="panel">
  <span class="s-avatar">导读</span>
  <span id="sText"></span>
</div>

<div id="stepper" class="panel">
  <div class="step-btn" data-stage="0">总览</div>
  <div class="step-btn" data-stage="1">① 页面入库</div>
  <div class="step-btn" data-stage="2">② 抽关系织网</div>
  <div class="step-btn" data-stage="3">③ 图谱成形</div>
  <div class="step-btn" data-stage="4">④ 沿图检索</div>
  <div class="step-btn" data-stage="5">⑤ 照图作答</div>
</div>

<div id="legend" class="panel">
  <div class="lg-title">节点与关系类型</div>
  <div class="lg-item"><span class="dot" style="color:#ffb74d;background:#ffb74d"></span>Wiki 门户（中心节点）</div>
  <div class="lg-item"><span class="dot" style="color:#4dd0e1;background:#4dd0e1"></span>Wiki 条目（页面）</div>
  <div class="lg-item"><span class="dot" style="color:#b388ff;background:#b388ff"></span>概念 / 实体（抽取所得）</div>
  <div class="lg-item"><span class="line" style="background:#4dd0e1"></span>「涵盖」关系</div>
  <div class="lg-item"><span class="line" style="background:#b388ff"></span>「引用」关系</div>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 悬停/点击节点查看关系圈</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 基础场景 ================= */
const container = document.getElementById('stage');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050a0a, 0.0022);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 45, 210);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x050a0a);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 60;
controls.maxDistance = 600;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= 工具 ================= */
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.28)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

function makeTextSprite(text, { fontSize = 26, color = '#dfe7ff', scale = 1 } = {}) {
  const pad = 14;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  ctx.font = `${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
  c.width = w; c.height = fontSize + pad * 2;
  ctx = c.getContext('2d');
  ctx.font = `${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = 12;
  ctx.fillText(text, pad, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set((w / c.height) * fontSize * 0.085 * scale, fontSize * 0.085 * scale, 1);
  return sp;
}

/* ================= 缓动 & 补间引擎 ================= */
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const tweens = [];
function tween({ dur = 1000, delay = 0, ease = easeInOut, onUpdate, onComplete }) {
  return new Promise(res => {
    tweens.push({ start: performance.now() + delay, dur, ease, onUpdate, onComplete: () => { onComplete && onComplete(); res(); }, done: false });
  });
}
function stepTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    if (tw.done) { tweens.splice(i, 1); continue; }
    if (now < tw.start) continue;
    let t = (now - tw.start) / tw.dur;
    if (t >= 1) t = 1;
    tw.onUpdate && tw.onUpdate(tw.ease(t), t);
    if (t >= 1) { tw.done = true; tw.onComplete && tw.onComplete(); }
  }
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= 图谱数据 ================= */
const TYPE_STYLE = {
  hub:     { color: 0xffb74d, css: '#ffb74d', label: 'Wiki 门户', r: 5.5 },
  page:    { color: 0x4dd0e1, css: '#4dd0e1', label: 'Wiki 条目', r: 3.4 },
  concept: { color: 0xb388ff, css: '#b388ff', label: '概念实体', r: 2.8 }
};
const EDGE_STYLE = {
  cover: { color: 0x2e9aa2, label: '涵盖' },
  ref:   { color: 0x9a7fe8, label: '引用' }
};

const NODE_DEFS = [
  { id: 'hub',      name: 'ToyAgent 项目 Wiki', type: 'hub' },
  { id: 'arch',     name: '架构概览',   type: 'page' },
  { id: 'guide',    name: '开发指南',   type: 'page' },
  { id: 'config',   name: '配置系统',   type: 'page' },
  { id: 'channel',  name: '渠道系统',   type: 'page' },
  { id: 'db',       name: '数据库设计', type: 'page' },
  { id: 'frontend', name: '前端架构',   type: 'page' },
  { id: 'mcp',      name: 'MCP 服务',   type: 'page' },
  { id: 'wiki',     name: 'Wiki 系统',  type: 'page' },
  { id: 'rag',      name: 'RAG 引擎',   type: 'page' },
  { id: 'compile',  name: '知识编译',   type: 'concept' },
  { id: 'bigram',   name: 'Bigram 检索', type: 'concept' },
  { id: 'vector',   name: '向量检索',   type: 'concept' },
  { id: 'graphrag', name: 'GraphRAG',   type: 'concept' },
  { id: 'plugin',   name: '插件机制',   type: 'concept' }
];
const EDGE_DEFS = [
  ['hub', 'arch', 'cover'], ['hub', 'guide', 'cover'], ['hub', 'config', 'cover'],
  ['hub', 'channel', 'cover'], ['hub', 'db', 'cover'], ['hub', 'frontend', 'cover'],
  ['hub', 'mcp', 'cover'], ['hub', 'wiki', 'cover'],
  ['arch', 'rag', 'ref'], ['arch', 'db', 'ref'], ['arch', 'frontend', 'ref'],
  ['guide', 'config', 'ref'], ['guide', 'plugin', 'ref'],
  ['channel', 'config', 'ref'], ['channel', 'db', 'ref'],
  ['wiki', 'compile', 'ref'], ['wiki', 'rag', 'ref'], ['wiki', 'bigram', 'ref'],
  ['rag', 'vector', 'ref'], ['rag', 'graphrag', 'ref'],
  ['graphrag', 'vector', 'ref'], ['frontend', 'mcp', 'ref'], ['mcp', 'plugin', 'ref']
];
const nodeById = {};
NODE_DEFS.forEach(n => nodeById[n.id] = n);

/* ================= 图谱对象构建 ================= */
const graphGroup = new THREE.Group();
scene.add(graphGroup);

const nodes = [];
const nodeMeshList = [];
const edges = [];
const nodeDegree = {};
EDGE_DEFS.forEach(([a, b]) => { nodeDegree[a] = (nodeDegree[a] || 0) + 1; nodeDegree[b] = (nodeDegree[b] || 0) + 1; });

NODE_DEFS.forEach(def => {
  const st = TYPE_STYLE[def.type];
  const group = new THREE.Group();
  group.position.set((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 40);
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(st.r, 22, 22),
    new THREE.MeshBasicMaterial({ color: st.color, transparent: true, opacity: 0.95 })
  );
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: st.color, transparent: true, opacity: 0.5,
    depthWrite: false, blending: THREE.AdditiveBlending
  }));
  glow.scale.setScalar(st.r * 6);
  const label = makeTextSprite(def.name, { fontSize: def.type === 'hub' ? 30 : 24, color: st.css, scale: def.type === 'hub' ? 1.15 : 1 });
  label.position.y = st.r + 7;
  group.add(sphere); group.add(glow); group.add(label);
  group.scale.setScalar(0.001);
  graphGroup.add(group);
  nodeMeshList.push(sphere);
  sphere.userData.nodeIdx = nodes.length;
  nodes.push({ def, group, sphere, glow, label, st,
    pos: group.position, vel: new THREE.Vector3(),
    baseColor: new THREE.Color(st.color), dim: 1, focusT: 0 });
});

EDGE_DEFS.forEach(([a, b, type]) => {
  const na = nodes[NODE_DEFS.findIndex(n => n.id === a)];
  const nb = nodes[NODE_DEFS.findIndex(n => n.id === b)];
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const mat = new THREE.LineBasicMaterial({
    color: EDGE_STYLE[type].color, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const line = new THREE.Line(geo, mat);
  graphGroup.add(line);
  edges.push({ a: na, b: nb, type, line, baseOp: type === 'cover' ? 0.3 : 0.38, targetOp: 0, curOp: 0, hot: false });
});

/* 力导向布局：斥力 + 弹簧 + 向心力 */
let layoutBoost = 0.5;
function physicsStep() {
  for (let i = 0; i < nodes.length; i++) {
    const ni = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const nj = nodes[j];
      const d = new THREE.Vector3().subVectors(ni.pos, nj.pos);
      const len = Math.max(d.length(), 1);
      const f = Math.min((1600 / (len * len)) * layoutBoost, 2.5);
      d.normalize().multiplyScalar(f);
      ni.vel.add(d);
      nj.vel.sub(d);
    }
  }
  edges.forEach(e => {
    const d = new THREE.Vector3().subVectors(e.b.pos, e.a.pos);
    const len = Math.max(d.length(), 1);
    const rest = e.type === 'cover' ? 54 : 46;
    d.normalize().multiplyScalar((len - rest) * 0.012 * layoutBoost);
    e.a.vel.add(d); e.b.vel.sub(d);
  });
  nodes.forEach(n => {
    n.vel.addScaledVector(n.pos, -0.012 * layoutBoost);
    n.vel.multiplyScalar(0.86);
    n.pos.add(n.vel);
  });
}
for (let i = 0; i < 320; i++) physicsStep(); // 预热：布局先收敛再亮相

let hovered = null, pinned = null;

const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('pointermove', ev => {
  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  pointerMoved = true;
});

  const links = edges.filter(e => e.a === n || e.b === n)
    .map(e => `${EDGE_STYLE[e.type].label} → ${e.a === n ? e.b.def.name : e.a.def.name}`);
  document.getElementById('ipLinks').innerHTML = links.map(s => `<span>${s}</span>`).join('');
  document.getElementById('infoPanel').style.opacity = 1;
}

function updateHover() {
  if (!pointerMoved) return;
  pointerMoved = false;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(nodeMeshList, false);
  const n = hits.length ? nodes[hits[0].object.userData.nodeIdx] : null;
  if (n !== hovered) {
    hovered = n;
    renderer.domElement.style.cursor = n ? 'pointer' : 'default';
  }
  const active = pinned || hovered;
  if (active) showInfo(active);
}

  const order = [...nodes].sort((a, b) => (a.def.type === 'hub' ? -1 : b.def.type === 'hub' ? 1 : 0));
  order.forEach((n, i) => {
    tween({ dur: 650, delay: 400 + i * 320, ease: easeOut, onUpdate: t => n.group.scale.setScalar(0.001 + t * 0.999) });
  });
  animateStats(NODE_DEFS.length, 0, 0, 400 + nodes.length * 320);
  await wait(400 + nodes.length * 320 + 900); if (tok !== runToken) return;
  narrate('节点就位 —— 但此刻它们只是<b>一座座孤岛</b>，互相不认识');
  await wait(1800);
}

/* --- 阶段2：抽关系织网 --- */
async function stageWeave(tok) {
  narrate('第二步 · <b>抽关系织网</b>：大模型阅读每个条目，问三个问题 —— <em>讲什么？提到谁？属于谁？</em>—— 抽出关系，织成边');
  layoutBoost = 0.5;
  nodes.forEach(n => { if (n.def.type === 'concept') n.group.scale.setScalar(0.001); });
  nodes.filter(n => n.def.type === 'concept').forEach((n, i) => {
    tween({ dur: 600, delay: 900 + i * 240, ease: easeOut, onUpdate: t => n.group.scale.setScalar(0.001 + t * 0.999) });
  });
  edges.forEach((e, i) => {
    tween({ dur: 500, delay: 500 + i * 220, onUpdate: t => e.curOp = t * e.baseOp, onComplete: () => {
      e.hot = true;
      setTimeout(() => { if (tok === runToken && stageIdx === 2) e.hot = false; }, 700);
    }});
  });
  animateStats(NODE_DEFS.length, EDGE_DEFS.length, 2, 500 + edges.length * 220);
  await wait(500 + edges.length * 220 + 1200); if (tok !== runToken) return;
  narrate('「涵盖」与「引用」两种关系织好了 —— 知识从<b>孤岛连成了大陆</b>');
  await wait(2200);
}

/* --- 阶段3：图谱成形 --- */
async function stageForm(tok) {
  flyCamera(new THREE.Vector3(60, 35, 195), new THREE.Vector3(0, 0, 0), 1800);
  narrate('第三步 · <b>图谱成形</b>：力导向布局让关系紧密的节点自然靠拢 —— 从任何节点出发，顺着边都能走到任何其他节点');
  layoutBoost = 1.6;
  await wait(4200); if (tok !== runToken) return;
  layoutBoost = 0.5;
  narrate('这张网有个特点：<b>越织越聪明</b> —— 每加一条边，检索能走的路就多一条');
  await wait(2600);
}

/* --- 阶段4：沿图检索（多跳遍历） --- */
async function stageTraverse(tok) {
  flyCamera(new THREE.Vector3(20, 30, 200), new THREE.Vector3(0, 0, 10), 1600);
  narrate('提问：<b>「Wiki 系统和 RAG 引擎怎么配合？」</b>—— 检索从命中<b>入口节点</b>开始，不再对着全部卡片算相似度');
  document.getElementById('qText').textContent = '“Wiki 系统和 RAG 引擎怎么配合？”';
  document.getElementById('aText').textContent = '';
  document.getElementById('qaPanel').style.opacity = 1;

  const entry = nodes.find(n => n.def.id === 'wiki');
  const qSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  qSprite.scale.set(11, 11, 1);
  const from = new THREE.Vector3(60, -110, 120);
  qSprite.position.copy(from);
  scene.add(qSprite);
  dynamic.querySprite = qSprite;
  await tween({ dur: 1400, ease: easeInOut, onUpdate: t => {
    qSprite.position.lerpVectors(from, entry.pos, t);
    qSprite.material.opacity = t;
  }});
  if (tok !== runToken) return;

  nodes.forEach(n => setNodeDim(n, n === entry ? 1 : 0.35));
  function setNodeDim(n, d) { n.dim = d; }
  edges.forEach(e => e.targetOp = e.baseOp * 0.4);

  narrate('命中<b>「Wiki 系统」</b> → 第一跳：邻接边逐条点亮 —— <b>知识编译、RAG 引擎、Bigram 检索</b>浮出水面');
  const hop1Edges = edges.filter(e => e.a === entry || e.b === entry);
  for (const e of hop1Edges) {
    if (tok !== runToken) return;
    e.targetOp = 0.95; e.hot = true;
    setNodeDim(e.a === entry ? e.b : e.a, 1);
    await wait(420);
  }
  await wait(900); if (tok !== runToken) return;

  narrate('第二跳：顺着<b>「RAG 引擎」</b>继续走 —— 又牵出<b>向量检索、GraphRAG</b>。这叫<em>多跳遍历</em>，普通最近邻检索做不到');
  const rag = nodes.find(n => n.def.id === 'rag');
  const hop2Edges = edges.filter(e => (e.a === rag || e.b === rag) && !hop1Edges.includes(e));
  for (const e of hop2Edges) {
    if (tok !== runToken) return;
    e.targetOp = 0.95; e.hot = true;
    setNodeDim(e.a === rag ? e.b : e.a, 1);
    await wait(420);
  }
  await wait(1400); if (tok !== runToken) return;
  narrate('子图收齐：<b>1 个入口 + 5 个关联节点</b> —— 比「只取最像的 5 张卡片」多了<em>关系上下文</em>');
  await wait(2200);
}

/* --- 阶段5：照图作答 --- */
async function stageAnswer(tok) {
  narrate('最后一步：把<b>问题 + 命中的子图</b>一起交给 AI —— 每个答案都能沿图回溯到源头条目');
  llmGroup.visible = true;
  llmGroup.scale.setScalar(0.1);
  tween({ dur: 800, ease: easeOut, onUpdate: t => llmGroup.scale.setScalar(0.1 + t * 0.9) });
  await wait(700); if (tok !== runToken) return;

  const ids = ['wiki', 'compile', 'rag', 'bigram', 'vector', 'graphrag'];
  const gathered = nodes.filter(n => ids.includes(n.def.id));
  dynamic.beams = [];
  gathered.forEach(n => {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x69f0ae, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
    sp.scale.set(3.4, 3.4, 1);
    scene.add(sp);
    dynamic.beams.push({ sprite: sp, from: n.pos.clone(), to: llmGroup.position.clone(), speed: 0.35 + Math.random() * 0.3, phase: Math.random() });
  });
  await wait(900); if (tok !== runToken) return;

  const answer = '两套系统这样配合：\n· Wiki 系统把项目知识编译成「条目节点」，检索时沿图谱多跳遍历；\n· RAG 引擎提供向量相似度打分，为遍历挑出最相关入口；\n· GraphRAG 把两者合一：先向量定位、再沿边扩展子图。\n—— 推理路径：Wiki 系统 → RAG 引擎 → GraphRAG，可沿图溯源。';
  const aEl = document.getElementById('aText');
  for (const ch of answer) {
    if (tok !== runToken) return;
    aEl.textContent += ch;
    await wait(24);
  }
  narrate('答案里那条 <b>Wiki 系统 → RAG 引擎 → GraphRAG</b>，正是刚才两次「跳跃」走过的路 —— <b>可解释、可溯源</b>，这就是知识图谱给 RAG 的最大加分');
  await wait(3000);
}

/* ================= 渲染循环 ================= */
const tmpColor = new THREE.Color();
const white = new THREE.Color(0xffffff);
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  stepTweens(now);
  controls.update();
  updateHover();

  physicsStep();

  // 节点视觉
  const active = pinned || hovered;
  const neighborSet = new Set();
  if (active) {
    edges.forEach(e => {
      if (e.a === active) neighborSet.add(e.b);
      if (e.b === active) neighborSet.add(e.a);
    });
  }
  nodes.forEach((n, i) => {
    const isHot = active && (n === active || neighborSet.has(n));
    n.focusT += ((isHot ? 1 : 0) - n.focusT) * 0.15;
    const vis = active && !isHot ? 0.3 : 1;
    const dimF = n.dim * vis;
    const breathe = 1 + Math.sin(now * 0.003 + i * 1.3) * 0.04;
    n.sphere.scale.setScalar(breathe * (0.9 + n.focusT * 0.35));
    n.glow.scale.setScalar(n.st.r * 6 * breathe * (0.9 + n.focusT * 0.4));
    tmpColor.copy(n.baseColor).multiplyScalar((0.35 + 0.65 * dimF) * (1 + n.focusT * 0.5));
    n.sphere.material.color.copy(tmpColor);
    n.glow.material.color.copy(tmpColor);
    n.label.material.opacity = Math.min(1, 0.35 + 0.65 * dimF + n.focusT * 0.5);
  });

  // 边视觉
  edges.forEach(e => {
    e.curOp += (e.targetOp - e.curOp) * 0.12;
    const pos = e.line.geometry.attributes.position;
    pos.setXYZ(0, e.a.pos.x, e.a.pos.y, e.a.pos.z);
    pos.setXYZ(1, e.b.pos.x, e.b.pos.y, e.b.pos.z);
    pos.needsUpdate = true;
    const hotBoost = e.hot ? 0.45 + Math.sin(now * 0.01) * 0.2 : 0;
    e.line.material.opacity = Math.min(1, e.curOp + hotBoost);
    tmpColor.set(EDGE_STYLE[e.type].color);
    if (e.hot || (active && (e.a === active || e.b === active))) tmpColor.lerp(white, 0.4);
    e.line.material.color.copy(tmpColor);
  });

  // 光束粒子
  dynamic.beams.forEach(b => {
    b.phase = (b.phase + b.speed * 0.012) % 1;
    b.sprite.position.lerpVectors(b.from, b.to, b.phase);
    b.sprite.material.opacity = 0.9 * Math.sin(b.phase * Math.PI);
  });
  if (llmGroup.visible) llmGlow.scale.setScalar(46 * (1 + Math.sin(now * 0.004) * 0.08));

  renderer.render(scene, camera);
}

/* ================= 启动 ================= */
try {
  animate();
  document.getElementById('loading').style.opacity = 0;
  setTimeout(() => document.getElementById('loading').remove(), 900);
  gotoStage(0);
} catch (e) {
  document.getElementById('loading').textContent = '初始化失败：' + e.message;
}
</script>
