  <rect x="176" y="630" width="14" height="14" rx="3" fill="#F97316"/>
  <text x="196" y="641.5" font-size="10.5" fill="#334155">assistant.tool_calls</text>
  <rect x="316" y="630" width="14" height="14" rx="3" fill="#F59E0B"/>
  <text x="336" y="641.5" font-size="10.5" fill="#334155">tool 结果</text>
  <rect x="416" y="630" width="14" height="14" rx="3" fill="#8B5CF6"/>
  <text x="436" y="641.5" font-size="10.5" fill="#334155">assistant 文本</text>
  <rect x="536" y="630" width="14" height="14" rx="3" fill="#6366F1"/>
  <text x="556" y="641.5" font-size="10.5" fill="#334155">system（免疫）</text>
  <rect x="676" y="630" width="14" height="14" rx="3" fill="#22C55E"/>
  <text x="696" y="641.5" font-size="10.5" fill="#334155">保留</text>
  <rect x="756" y="630" width="14" height="14" rx="3" fill="#EF4444"/>
  <text x="776" y="641.5" font-size="10.5" fill="#334155">丢弃 / 配对丢弃</text>

  <text x="76" y="668" font-size="10.5" fill="#475569">裁剪顺序：永远从队头（最老）开始丢；触发条件 est ＞ 100 且条数 ＞ KEEP_MIN；每丢一条即重算。</text>
  <text x="76" y="686" font-size="10.5" fill="#475569">配对铁律：assistant.tool_calls 与紧随其后的 tool 结果同组丢弃 —— 孤儿 tool 消息会被真实 API 直接拒绝。</text>
  <text x="76" y="704" font-size="10.5" fill="#475569">对照生产版：丢"结果"留"调用记录"= tool-result clearing（可重取即无损）；整窗摘要 = compaction（保骨架、丢末节）。</text>
</svg>
